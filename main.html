<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop the IDF Visit – Contact the University</title>
  <style>
    :root {
      --bg: #0c0f14;
      --surface: #161b24;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --border: #1e293b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(239, 68, 68, 0.12) 0%, transparent 60%);
      pointer-events: none;
      z-index: -1;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    .card {
      max-width: 440px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.25rem 1.75rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.25;
      margin-bottom: 0.85rem;
    }

    .lead {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 1.75rem;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      background: var(--accent);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 1rem 1.75rem;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.15s ease;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
      width: 100%;
    }

    .cta-button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.5);
    }

    .cta-button svg {
      width: 18px;
      height: 18px;
    }

    .note {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (min-width: 480px) {
      .card {
        padding: 2.75rem 2.25rem;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>An IDF soldier is coming to campus.</h1>
      
      <p class="lead">
        Tell the university this is not welcome.
      </p>

      <a 
        class="cta-button" 
        href="mailto:Studentgroups@guild.bham.ac.uk,Marketing@guild.bham.ac.uk,communications@guild.bham.ac.uk,vc@bham.ac.uk,J.Elsmore@bham.ac.uk,student-complaints@contacts.bham.ac.uk,enquiries@guild.bham.ac.uk,president@guild.bham.ac.uk,E.Badger@guild.bham.ac.uk?subject=Concern%20Regarding%20Hosting%20of%20IDF%20Soldier%20at%20University%20Event&body=To%20all%20concerned%2C%0A%0A%20I%20am%20writing%20to%20express%20my%20concern%20that%20the%20University%20of%20Birmingham%20and%20its%20Guild%20of%20Students%20has%20authorised%20the%20promotion%20of%20an%20event%20with%20a%20visiting%20IDF%20soldier%20and%20war%20criminal%20through%20two%20guild%20affiliated%20societies-%20the%20Israeli%20Society%20and%20the%20Jewish%20Society.%0A%0AThis%20is%20a%20very%20concerning%20state%20of%20affairs%20as%20it%20is%20clear%20through%20international%20law%20that%20the%20IDF%20and%20Israel%20has%20broken%20international%20law%20and%20wages%20genocide%20against%20the%20Palestinians.%20The%20highest%20court%20in%20international%20affairs%2C%20The%20International%20Criminal%20Court%20ruled%20that%20Israel%20in%20its%20military%20operation%20through%20the%20IDF%20had%20broken%20international%20law%20by%20murdering%20civilians%2C%20bombing%20hospitals%20and%20indiscriminately%20bombing%20Gaza%2C%20calling%20it%20a%20display%20of%20genocidal%20acts.%20They%20made%20further%20rulings%20that%20Israel%E2%80%99s%20occupation%20over%20Palestine%20was%20illegal%20and%20must%20withdraw%20immediately.%20The%20UN%20backed%20this%20through%20a%20resolution%20which%20calls%20for%20Israel%20to%20comply%20with%20international%20law%20and%20withdraw%20its%20military%20forces%2C%20immediately%20cease%20all%20new%20settlement%20activity%2C%20evacuate%20all%20settlers%20from%20occupied%20land%2C%20and%20dismantle%20parts%20of%20the%20separation%20wall%20it%20constructed%20inside%20the%20occupied%20West%20Bank.%0A%0AThe%20alarming%20implications%20of%20this%20event%20proceeding%20cannot%20be%20overstated.%20As%20a%20British%20university%2C%20your%20institution%20holds%20a%20significant%20responsibility%20in%20fostering%20critical%20thinking%2C%20academic%20integrity%2C%20and%20inclusive%20dialogue.%20Offering%20a%20platform%20to%20a%20representative%20of%20a%20foreign%20military%E2%80%94especially%20one%20involved%20in%20ongoing%20genocide%E2%80%94raises%20serious%20concerns%20about%20the%20potential%20for%20the%20spread%20of%20propaganda.%20It%20is%20crucial%20that%20universities%20maintain%20an%20ethical%20approach%20when%20hosting%20speakers.%20By%20allowing%20this%20event%20to%20proceed%2C%20it%20appears%20that%20the%20university%20may%20be%20endorsing%20a%20one-sided%2C%20violent%20perspective%2C%20without%20proper%20consideration%20for%20the%20sensitive%20nature%20of%20the%20issues%20at%20hand%2C%20whilst%20a%20Law%20school%20event%20last%20year%2C%20which%20had%20watermelons%20in%20the%20advertisement%2C%20was%20cancelled%20due%20to%20not%20being%20%27inclusive%27%20and%20%27balanced%27%20enough.%0A%0AI%20urge%20you%20to%20reconsider%20the%20implications%20of%20this%20decision%20and%20ensure%20that%20any%20future%20events%20uphold%20the%20principles%20of%20integrity%2C%20and%20respect%20for%20all%20involved.%0A%0ASincerely%2C%0A%5BYour%20Name%5D
"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        Send the message
      </a>

      <p class="note">
        Opens your email with a short draft ready to send.
      </p>
    </div>
  </main>
</body>
</html>
